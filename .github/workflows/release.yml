name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-14
            artifact: macos
          - platform: Windows
            os: windows-2022
            artifact: windows
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: app/desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Build desktop installer
        run: npm run tauri build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiro-desktop-pet-${{ matrix.artifact }}
          path: app/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Create GitHub release if needed
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "Kiro Desktop Pet ${GITHUB_REF_NAME}" --generate-notes

      - name: Upload release installers
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -print0 | xargs -0 -I{} gh release upload "${GITHUB_REF_NAME}" "{}" --clobber
